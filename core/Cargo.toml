[package]
name = "cursor_pilot_core"
version = "0.1.0"
edition = "2021"
description = "Cursor Pilot core: Claude client, conversation state and response parsing, exposed over a C ABI."
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
